<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Protótipo Amor Zeloso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&family=Jost:wght@500;600&display=swap">
<style>
/* Layout: uma coluna de celular (≤430px) centralizada; no PC vira um "aparelho" sobre fundo da marca. */
:root{
  --choc:#321D10; --choc-2:#4A2C1A; --cream:#F9ECD7; --paper:#FCF6EC; --tonal:#F1E2CC;
  --gold:#B8915B; --gold-ink:#8A6634; --rose:#AD776B; --ink:#2A1A10; --muted:#7A6455;
  --line:rgb(50 29 16 / .10); --ok:#2F7A4B; --ok-bg:#E3F1E7; --warn:#A5561B; --warn-bg:#FBE9DA;
  --stage:#E9DCC8; --card:#FFFDF9; --on-choc:#F9ECD7;
  --shadow:0 1px 2px rgb(50 29 16 / .10),0 6px 18px rgb(50 29 16 / .10);
  --shadow-btn:0 1px 2px rgb(50 29 16 / .18),0 6px 16px rgb(50 29 16 / .18);
  --f-display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Jost","Futura","Century Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --choc:#F1DDBF; --choc-2:#FFF0D8; --cream:#2A1810; --paper:#1C110B; --tonal:#33221A;
  --gold:#D4AE76; --gold-ink:#E3C08C; --rose:#D79E90; --ink:#F6E9D6; --muted:#BFA791;
  --line:rgb(241 221 191 / .12); --ok:#7CCB98; --ok-bg:#1E3326; --warn:#F0A46A; --warn-bg:#3A2416;
  --stage:#120B07; --card:#26170F; --on-choc:#2A1810;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 20px rgb(0 0 0 / .35);
  --shadow-btn:0 1px 2px rgb(0 0 0 / .5),0 6px 16px rgb(0 0 0 / .4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --choc:#F1DDBF; --choc-2:#FFF0D8; --cream:#2A1810; --paper:#1C110B; --tonal:#33221A;
  --gold:#D4AE76; --gold-ink:#E3C08C; --rose:#D79E90; --ink:#F6E9D6; --muted:#BFA791;
  --line:rgb(241 221 191 / .12); --ok:#7CCB98; --ok-bg:#1E3326; --warn:#F0A46A; --warn-bg:#3A2416;
  --stage:#120B07; --card:#26170F; --on-choc:#2A1810;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 20px rgb(0 0 0 / .35);
  --shadow-btn:0 1px 2px rgb(0 0 0 / .5),0 6px 16px rgb(0 0 0 / .4);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding-block:0}
.phone{position:relative;width:100%;max-width:430px;min-height:100vh;background:var(--paper);display:flex;flex-direction:column}
@media (min-width:600px){.stage{padding-block:28px}.phone{min-height:860px;height:860px;border-radius:38px;box-shadow:0 30px 80px rgb(50 29 16 / .35),0 0 0 10px var(--choc);overflow:hidden}}
.demo-strip{background:var(--choc);color:var(--on-choc);padding:8px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.demo-label{font-family:var(--f-label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:center;opacity:.8}
.who{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgb(255 255 255 / .12);border-radius:999px;padding:4px}
.who button{display:flex;align-items:center;justify-content:center;min-height:46px;border:2px solid transparent;background:none;color:var(--on-choc);font-family:var(--f-body);font-weight:700;font-size:18px;padding:0 12px;border-radius:999px;cursor:pointer;white-space:nowrap;min-width:0;transition:background .15s}
.who button[aria-pressed="true"]{background:var(--cream);color:var(--choc);border-color:var(--gold)}
:root[data-theme="dark"] .who button[aria-pressed="true"]{color:var(--ink)}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:56px;border-bottom:1px solid var(--line);background:var(--paper)}
.logo{width:36px;height:36px;border-radius:50%;flex:none}
header.top h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar.has-photo{padding:0;overflow:hidden;box-shadow:0 0 0 2px var(--gold)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.chip img{width:26px;height:26px;border-radius:50%;object-fit:cover;margin-left:-10px}
.chip[aria-pressed="true"] img{box-shadow:0 0 0 2px var(--gold)}
.who img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px rgb(255 255 255 / .25)}
.who button[aria-pressed="true"] img{box-shadow:0 0 0 2px var(--gold)}
.who span{overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--tonal);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--choc);border:0;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.focus main{padding-bottom:110px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.eyebrow{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin:0}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
h3{font-size:17px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
/* Botões */
.btn{--h:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h);padding:0 18px;border-radius:14px;border:0;font-weight:600;font-size:16px;cursor:pointer;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease;text-decoration:none;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.chip:focus-visible,.card-btn:focus-visible,.flavor:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--choc) 92%,white) 0%,var(--choc) 100%);color:var(--on-choc);box-shadow:var(--shadow-btn)}
.btn-primary:active{filter:brightness(.92)}
.btn-tonal{background:var(--tonal);color:var(--choc)}
.btn-ghost{background:none;color:var(--choc);padding:0 10px;min-height:44px}
.btn-ok{background:var(--ok);color:#fff;box-shadow:var(--shadow-btn)}
:root[data-theme="dark"] .btn-ok{color:#0f1f15}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-ok{color:#0f1f15}}
.btn-lg{--h:56px;font-size:17px;border-radius:16px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn svg{width:20px;height:20px;flex:none}
.icon-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.icon-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--tonal);border:0;color:var(--choc);font-size:12px;font-weight:600;cursor:pointer;min-height:60px;transition:transform .12s}
.icon-btn:active{transform:scale(.96)}
.icon-btn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--tonal);color:var(--choc);font-weight:600;font-size:15px;cursor:pointer;transition:transform .12s}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--choc);color:var(--on-choc)}
.chip svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* Cartões */
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--tonal);color:var(--choc)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill svg{width:14px;height:14px}
.initials{width:44px;height:44px;border-radius:50%;background:var(--choc);color:var(--on-choc);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{display:inline-flex;align-items:center;gap:6px;background:var(--tonal);border-radius:999px;padding:3px 10px 3px 3px;font-size:14px;font-weight:600}
.thumb img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:2px;border:0;text-align:left;cursor:pointer;transition:transform .12s}
.kpi:active{transform:scale(.98)}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi strong{font-size:24px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--choc)}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.prod-row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.prod-row img{width:40px;height:40px;border-radius:12px;object-fit:cover}
.bar{height:8px;border-radius:999px;background:var(--tonal);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));border-radius:999px}
.num{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.num small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.done{opacity:.6}
/* Nav */
nav.bottom{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--paper);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
@media (max-width:599px){nav.bottom,.totalbar{position:fixed;max-width:430px;margin:0 auto}}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer;min-height:52px;justify-content:center;border-radius:14px}
nav.bottom button[aria-current="page"]{color:var(--choc)}
nav.bottom button[aria-current="page"] svg{stroke-width:2.4}
nav.bottom svg{width:24px;height:24px}
nav.bottom .plus{justify-self:center;width:58px;height:58px;border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--choc) 90%,white),var(--choc));color:var(--on-choc);box-shadow:0 2px 4px rgb(50 29 16 / .25),0 10px 22px rgb(50 29 16 / .28);transform:translateY(-10px)}
nav.bottom .plus svg{width:28px;height:28px}
/* Pedido em foco */
.steps{display:flex;gap:6px}
.steps span{flex:1;height:5px;border-radius:999px;background:var(--tonal)}
.steps span.on{background:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cust{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px;border:0;text-align:left;cursor:pointer;min-height:72px;transition:transform .12s}
.cust:active{transform:scale(.98)}
.cust b{display:block;font-size:16px}
.cust small{color:var(--muted);font-size:13px}
.flavor{position:relative;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:8px;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;transition:transform .12s,border-color .12s}
.flavor:active{transform:scale(.97)}
.flavor.sel{border-color:var(--gold)}
.flavor img{width:100%;aspect-ratio:16/11;object-fit:cover;border-radius:12px;max-width:100%}
.flavor .name{font-weight:700;font-size:16px;padding-inline:4px}
.flavor .price{font-size:13px;color:var(--muted);padding-inline:4px;padding-bottom:2px}
.badge{position:absolute;top:2px;right:2px;min-width:34px;height:34px;border-radius:999px;background:var(--choc);color:var(--on-choc);display:grid;place-items:center;font-weight:700;font-size:16px;box-shadow:var(--shadow-btn);padding:0 8px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stepper button{width:40px;height:40px;border-radius:12px;border:0;background:var(--tonal);color:var(--choc);display:grid;place-items:center;cursor:pointer}
.stepper button svg{width:18px;height:18px}
.stepper b{font-variant-numeric:tabular-nums;font-size:16px}
.totalbar{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center}
.totalbar .t{flex:none;min-width:0}
.totalbar .t small{display:block;color:var(--muted);font-size:12px}
.totalbar .t strong{font-size:20px;font-variant-numeric:tabular-nums}
.totalbar .btn{flex:1}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.success{align-items:center;text-align:center;padding-top:30px}
.check{width:84px;height:84px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.check svg{width:44px;height:44px}
.bubble{background:#DCF8C6;color:#1b2b14;border-radius:14px 14px 4px 14px;padding:12px 14px;text-align:left;font-size:15px;white-space:pre-line;box-shadow:var(--shadow);max-width:100%}
/* Folha inferior */
.scrim{position:absolute;inset:0;background:rgb(30 16 8 / .45);display:flex;align-items:flex-end;z-index:20}
@media (max-width:599px){.scrim{position:fixed}}
.sheet{width:100%;background:var(--paper);border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.grab{width:44px;height:5px;border-radius:999px;background:var(--line);align-self:center}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.money{display:flex;gap:8px;align-items:stretch}
.money label{flex:1;display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0 14px;min-height:56px}
.money label:focus-within{border-color:var(--gold)}
.money label span{font-weight:700;color:var(--muted)}
.money input{border:0;background:none;font:inherit;font-size:24px;font-weight:700;width:100%;min-width:0;color:var(--ink);font-variant-numeric:tabular-nums;outline:none}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--choc);color:var(--on-choc);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-btn);z-index:30;font-weight:600;font-size:15px}
@media (max-width:599px){.toast{position:fixed;max-width:398px;margin:0 auto}}
.toast button{margin-left:auto;background:none;border:0;color:var(--gold);font-weight:700;font-size:15px;cursor:pointer;min-height:40px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;border:0;text-align:left;cursor:pointer;min-height:92px;hyphens:auto}
.tile svg{width:24px;height:24px;color:var(--gold-ink)}
.tile b{font-size:15px}
.tile small{color:var(--muted);font-size:12px}
.note{font-size:13px;color:var(--muted);text-align:center}
.routeart{position:relative;height:120px;border-radius:16px;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px),var(--tonal);overflow:hidden}
.routeart svg{position:absolute;inset:0;width:100%;height:100%}
.ra-a,.ra-b{position:absolute;font-size:12px;font-weight:700;color:var(--choc)}.ra-a{left:12px;bottom:4px}.ra-b{right:10px;top:42px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.cal button{position:relative;min-height:50px;max-width:100%;border:2px solid transparent;border-radius:14px;background:none;font:inherit;font-weight:600;font-size:16px;line-height:1;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 0}
.cal button.today{border-color:var(--gold)}
.cal button:disabled{opacity:.3;cursor:not-allowed}
.cal button.sel{background:var(--choc);color:var(--on-choc)}
.cal button i{font-style:normal;font-size:10px;font-weight:700;min-width:16px;height:15px;line-height:15px;padding:0 4px;border-radius:999px;background:var(--rose);color:#fff}
.cal button.sel i{background:var(--gold);color:var(--choc)}
.rem{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.rem b{font-size:15px;font-weight:600;display:block}
.rem.is-done b{text-decoration:line-through;color:var(--muted)}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);background:none;display:grid;place-items:center;cursor:pointer;color:var(--on-choc);padding:0}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tick svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 14px;font:inherit;font-size:17px;color:var(--ink);outline:none}
.field input:focus{border-color:var(--gold)}
.chip-input{position:relative;padding:0 6px 0 14px}
.chip-input input{border:0;background:none;font:inherit;font-weight:600;color:inherit;min-height:40px;max-width:150px;color-scheme:inherit}
.chip-input[aria-pressed="true"]{background:var(--choc);color:var(--on-choc)}
.field textarea{border-radius:14px;border:2px solid var(--line);background:var(--card);padding:12px 14px;font:inherit;font-size:16px;line-height:1.45;color:var(--ink);outline:none;resize:vertical;min-height:140px}
.field textarea:focus{border-color:var(--gold)}
button.date-chip{border:0;cursor:pointer;min-height:42px;flex:none}
.draft{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.draft.off{opacity:.5}
.dline{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.dline img{width:34px;height:34px;border-radius:10px;object-fit:cover}
.dline span{font-weight:600}
.initials.pros{background:var(--tonal);color:var(--choc);border:2px dashed var(--gold)}
.card.visit{border:2px dashed color-mix(in srgb,var(--gold) 60%,transparent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--tonal);border-radius:999px;padding:4px}
.seg button{min-height:44px;border:2px solid transparent;border-radius:999px;background:none;font:inherit;font-weight:700;color:var(--choc);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);border-color:var(--gold);box-shadow:var(--shadow)}
.mixpic{display:inline-grid;grid-template-columns:1fr 1fr;width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none}
.mixpic img{width:100%;height:100%;object-fit:cover;border-radius:0!important}
.rv{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none}
.mixpic.rv{width:40px;height:40px;border-radius:12px}
.dline .mixpic{width:34px;height:34px;border-radius:10px}
.mixpic.big{width:100%;aspect-ratio:16/11;height:auto;border-radius:12px;gap:2px;background:var(--card)}
.mixcard{border:2px dashed var(--gold)!important}
.box12{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border-radius:18px;background:var(--tonal);max-width:320px;margin:0 auto;width:100%}

 if(ds.dq){const [i,k,dv]=ds.dq.split('|');const d=drafts[+i];d.items[k]=Math.max(0,(d.items[k]||0)+Number(dv));S.keepScroll=true;render();return}
 if(ds.act==='confirmDrafts'){const ok=drafts.filter(d=>d.sel&&boxes(d.items));ok.forEach(d=>{const items=Object.fromEntries(Object.entries(d.items).filter(([,q])=>q>0));(confirmedGen[d.day]=confirmedGen[d.day]||[]).push({id:'w'+d.day+d.c,c:d.c,...PLACE[d.c],time:d.time,items,pay:C(d.c).pay,status:'scheduled',paid:0})});
  drafts=null;toast(ok.length+' pedidos confirmados. Já aparecem na agenda.');render();return}
 if(ds.act==='newRem'){S.sheet={type:'rem',t:'',day:S.day,time:'09:00',notify:'15 min antes',nday:S.day,ntime:'08:00',who:S.role==='alda'?'Operadora':'Administrador',err:false};S.keepScroll=true;render();setTimeout(()=>document.getElementById('rem-t')?.focus(),50);return}
 if(ds.remday){S.sheet.day=ds.remday;S.sheet.nday=ds.remday;render();return}
 if(ds.remtime){S.sheet.time=ds.remtime;render();return}
 if(ds.remnot){S.sheet.notify=ds.remnot;render();return}
 if(ds.remwho){S.sheet.who=ds.remwho;render();return}
 if(ds.remDone){const r=reminders.find(x=>x.id===ds.remDone);r.done=!r.done;S.keepScroll=true;render();return}
 if(ds.act==='saveRem'){const r=S.sheet;if(!r.t.trim()){r.err=true;render();document.getElementById('rem-t')?.focus();return}
  reminders.push({id:'r'+Date.now(),t:r.t.trim(),day:r.day,time:r.time,notify:r.notify,nday:r.nday,ntime:r.ntime,who:r.who,done:false});
  const msg=r.notify==='Não avisar'?'Lembrete salvo':'Lembrete salvo · '+notifyText(r);S.sheet=null;toast(msg);S.keepScroll=true;render();return}
 if(ds.act==='cal'){S.sheet={type:'cal',month:S.day.slice(0,7)};S.keepScroll=true;render();return}
 if(ds.mon){const [y,m]=S.sheet.month.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+Number(ds.mon),1));S.sheet.month=d.toISOString().slice(0,7);render();return}
 if(ds.day&&S.sheet&&S.sheet.pick==='order'){S.order.day=ds.day;setWhen(S.order);S.sheet=null;S.keepScroll=true;render();return}
 if(ds.day){S.day=ds.day;S.view='hoje';S.sheet=null;render();return}
 if(ds.act==='pickDate'){S.sheet={type:'cal',month:S.order.day.slice(0,7),pick:'order'};S.keepScroll=true;render();return}
 if(ds.oday){S.order.day=ds.oday;setWhen(S.order);S.keepScroll=true;render();return}
 if(ds.otime){S.order.time=ds.otime;setWhen(S.order);S.keepScroll=true;render();return}
 if(ds.map){S.sheet={type:'map',id:ds.map};S.keepScroll=true;render();return}
 if(ds.ext){S.sheet={type:'info',title:ds.ext,text:EXT[ds.ext]||'Esta função estará disponível no app completo.'};S.keepScroll=true;render();return}
 if(ds.deliver){const d=deliveries.find(x=>x.id===ds.deliver);d.status='done';S.lastDone=d.id;
   if(d.pay==='Na entrega'){S.sheet={type:'receive',id:d.id,cents:total(d.items),method:'Pix'}}else{S.sheet={type:'trip',id:d.id,mode:'Uber',leg:'Ida e volta',cents:0};toast('Entrega registrada',true)}
   S.keepScroll=true;render();return}
 if(ds.method){S.sheet.method=ds.method;render();return}
 if(ds.trip){S.sheet.mode=ds.trip;render();return}
 if(ds.leg){S.sheet.leg=ds.leg;render();return}
 if(ds.act==='saveRcv'){const d=deliveries.find(x=>x.id===S.sheet.id);d.paid=S.sheet.cents;receivedToday+=S.sheet.cents;S.sheet={type:'trip',id:d.id,mode:'Uber',leg:'Ida e volta',cents:0};toast('Recebimento de '+brl(d.paid)+' registrado',true);render();return}
 if(ds.act==='skipRcv'){const id=S.sheet.id;S.sheet={type:'trip',id,mode:'Uber',leg:'Ida e volta',cents:0};render();return}
 if(ds.act==='saveTrip'){tripsWeek+=S.sheet.cents;const m=S.sheet.mode;S.sheet=null;toast('Corrida de '+m+' salva');S.keepScroll=true;render();return}
 if(ds.act==='closeSheet2'){S.sheet=null;S.keepScroll=true;render();return}
 if(ds.act==='okMoney'){document.activeElement?.blur();return}
 if(ds.act==='undo'){const d=deliveries.find(x=>x.id===S.lastDone);if(d){if(d.paid){receivedToday-=d.paid;d.paid=0}d.status='pending'}S.toast=null;S.sheet=null;S.keepScroll=true;render();return}
 if(ds.act==='confirmAll'){const n=toConfirm.filter(t=>t.sel).length;toConfirm=toConfirm.filter(t=>!t.sel);toast(n+' pedido(s) confirmado(s)');render();return}
 /* pedido */
 const o=S.order;
 if(ds.act==='oback'){if(o.step>1&&o.step<4){o.step--;}else{S.order=null}render();return}
 if(ds.pick){o.c=ds.pick;o.items={};o.step=2;render();return}
 if(ds.sub){e.stopPropagation();const q=(o.items[ds.sub]||0)-1;if(q<=0)delete o.items[ds.sub];else o.items[ds.sub]=q;S.keepScroll=true;render();return}
 if(ds.add2){e.stopPropagation();o.items[ds.add2]=(o.items[ds.add2]||0)+1;S.keepScroll=true;render();return}
 if(ds.add){o.items[ds.add]=(o.items[ds.add]||0)+1;S.keepScroll=true;render();return}
 if(ds.act==='repeat'){o.items={...C(o.c).last};S.keepScroll=true;render();return}
 if(ds.act==='review'){o.step=3;o.pay=o.pay||C(o.c).pay.split(' ·')[0];if(!['Na entrega','Adiantado','A prazo'].includes(o.pay))o.pay='Na entrega';render();return}
 if(ds.set){o[ds.set]=ds.val;S.keepScroll=true;render();return}
 if(ds.act==='confirm'){const k=o.day;const d={id:'o'+Date.now(),c:o.c,...PLACE[o.c],time:o.time,items:{...o.items},pay:o.pay==='A prazo'?'A prazo · semanal':o.pay,status:k===TODAY?'pending':'scheduled',paid:0};
  if(k===TODAY)deliveries.push(d);else if(k>=WEEK0)(confirmedGen[k]=confirmedGen[k]||[]).push(d);else{deliveriesFor(k);gen[k].push(d)}
  o.step=4;render();return}
 if(ds.act==='oagenda'){const k=o.day;S.order=null;S.view='hoje';S.day=k;render();return}
 if(ds.act==='ofinish'){S.order=null;S.view='hoje';render();return}
});
app.addEventListener('input',e=>{const f=e.target.dataset.remf;if(f&&S.sheet&&S.sheet.type==='rem'){S.sheet[f]=e.target.value;if(f==='t'&&S.sheet.err&&e.target.value.trim()){S.sheet.err=false}}});
app.addEventListener('change',e=>{const f=e.target.dataset.remf;if(f&&f!=='t'&&S.sheet&&e.target.value){S.sheet[f]=e.target.value;if(f==='day')S.sheet.nday=e.target.value;render()}});
app.addEventListener('input',e=>{if(e.target.dataset.watext&&S.sheet){S.sheet.text=e.target.value;const a=document.getElementById('wa-go');if(a)a.href='https://wa.me/?text='+encodeURIComponent(e.target.value)}});
app.addEventListener('input',e=>{if(e.target.dataset.vnote&&S.sheet)S.sheet.note=e.target.value});
app.addEventListener('change',e=>{if(e.target.dataset.vrem&&S.sheet){S.sheet.rem=e.target.checked}});
app.addEventListener('change',e=>{if(e.target.dataset.otimein&&S.order&&e.target.value){S.order.time=e.target.value;setWhen(S.order);S.keepScroll=true;render()}});
app.addEventListener('keydown',e=>{const f=e.target.closest('[data-add]');if(f&&(e.key==='Enter'||e.key===' ')){e.preventDefault();f.click()}});
app.addEventListener('change',e=>{const ds2=e.target.dataset.dsel;if(ds2!==undefined){drafts[+ds2].sel=e.target.checked;S.keepScroll=true;render();return}const i=e.target.dataset.tc;if(i!==undefined){toConfirm[i].sel=e.target.checked;S.keepScroll=true;render()}});
/* Campo de valor: vazio ao tocar, vírgula automática, restaura ao sair vazio */
app.addEventListener('focusin',e=>{const id=e.target.dataset.money;if(id){e.target.dataset.prev=e.target.value;e.target.value=''}});
app.addEventListener('input',e=>{const id=e.target.dataset.money;if(!id)return;const dig=e.target.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,7);const c=parseInt(dig||'0',10);e.target.value=dig?(c/100).toFixed(2).replace('.',','):'';if(S.sheet)S.sheet.cents=c;const b=app.querySelector('[data-act="saveRcv"],[data-act="saveTrip"]');if(b){if(b.dataset.act==='saveRcv')b.lastChild.textContent='Registrar '+brl(c);else b.disabled=!c}});
app.addEventListener('focusout',e=>{const id=e.target.dataset.money;if(id&&!e.target.value){e.target.value=e.target.dataset.prev||'';const c=parseInt((e.target.value||'0').replace(/\D/g,''),10);if(S.sheet)S.sheet.cents=c;const b=app.querySelector('[data-act="saveRcv"],[data-act="saveTrip"]');if(b){if(b.dataset.act==='saveRcv')b.lastChild.textContent='Registrar '+brl(c);else b.disabled=!c}}});
function convert(p){p.status='Virou cliente';const id='c'+(CUSTOMERS.length+1);CUSTOMERS.push({id,n:p.n,s:'Novo cliente · veio de visita',ini:p.ini,pay:'A definir',last:{}});PLACE[id]={addr:p.addr,q:p.q,km:p.km,min:p.min};S.newCust=id;S.sheet={type:'welcome',n:p.n};render()}
function setRole(r){S.role=r;S.view='hoje';S.day=TODAY;S.order=null;S.sheet=null;document.getElementById('as-alda').setAttribute('aria-pressed',r==='alda');document.getElementById('as-tiago').setAttribute('aria-pressed',r==='tiago');render()}
document.getElementById('as-alda').onclick=()=>setRole('alda');
document.getElementById('as-tiago').onclick=()=>setRole('tiago');
const fromHash=()=>{const h=(location.hash||'').replace('#','').toLowerCase();if(h==='tiago'||h==='alda')setRole(h);else render()};
window.addEventListener('hashchange',fromHash);
fromHash();
})();
</script>
