name: Validação da gestão
# Repositório privado: o plano gratuito tem 2.000 minutos de Actions por mês.
# - Mudanças só em documentação não rodam a bateria.
# - Envio novo no mesmo branch cancela a execução anterior.
# - Nos branches de trabalho, testes de tela só no Chromium móvel; no main,
#   em pull requests e na execução manual, nos três navegadores.
on:
  push:
    paths-ignore: ['docs/**', '**.md', '.zap/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', '.zap/**']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api
      - run: npm run test:listing
      - run: npm run test:r2
      - run: npm run test:p1
      - run: npm run test:finance
      - run: npm run test:operations
      - run: npm run test:workday
      - run: npm run test:brand
      - run: npm run test:migrations
      - run: npm run db:migrate:local
      - run: npm run build:pages
      - run: npm run test:mobile
      - run: npm run test:kits
      - run: npm run test:weight-costing
      - run: npm run test:mixed
      - run: npm run test:push
      - run: npm run test:field
      - run: npm run test:routing
      - run: npm run test:inventory
      - run: npm run test:import
      - run: npm run test:backup
      - run: npm run test:security
      - run: npm run test:cleanup
      - name: Testes de tela (três navegadores)
        if: github.ref == 'refs/heads/main' || github.event_name != 'push'
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
      - name: Testes de tela (Chromium móvel, branch de trabalho)
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium-mobile
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: resultados-playwright
          path: test-results/
          retention-days: 7
