name: Validação da gestão
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api
      - run: npm run test:listing
      - run: npm run test:r2
      - run: npm run test:p1
      - run: npm run test:finance
      - run: npm run test:operations
      - run: npm run test:brand
      - run: npm run test:migrations
      - run: npm run db:migrate:local
      - run: npm run build:pages
      - run: npm run test:mobile
      - run: npm run test:field
      - run: npm run test:inventory
      - run: npm run test:import
      - run: npm run test:backup
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-playwright
          path: test-results/
          retention-days: 7
