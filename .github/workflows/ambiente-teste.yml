name: Ambiente de teste (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Etapa do ambiente de teste
        type: choice
        default: VERIFICAR
        options:
          - VERIFICAR
          - APLICAR_MIGRACOES
          - COPIAR_DO_REAL
          - LIMPAR
          - ATUALIZAR_APP
      confirmo:
        description: Autorizo esta ação no ambiente de teste
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ambiente-teste
  cancel-in-progress: false

jobs:
  preparar-banco:
    if: github.ref == 'refs/heads/main' && inputs.mode != 'ATUALIZAR_APP'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ambiente-teste
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verificar ou preparar somente o banco de teste
        run: node scripts/run-test-environment.mjs
        env:
          TEST_ENV_MODE: ${{ inputs.mode }}
          TEST_ENV_CONFIRMED: ${{ inputs.confirmo }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  atualizar-app:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'ATUALIZAR_APP'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ambiente-teste
    permissions:
      contents: write
    steps:
      - name: Exigir confirmação
        env:
          TEST_ENV_CONFIRMED: ${{ inputs.confirmo }}
        run: test "$TEST_ENV_CONFIRMED" = true
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          # Histórico completo: o push precisa enxergar a branch teste para avançar.
          fetch-depth: 0
      - name: Atualizar apenas a branch teste
        run: git push origin HEAD:refs/heads/teste
