name: Segurança
# Repositório privado: gitleaks e npm audit rodam a cada envio de código (um
# job curto); ZAP só semanal/manual. CodeQL e dependency-review foram removidos:
# em repositório privado exigem GitHub Advanced Security (pago).
on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  segredos_e_dependencias:
    name: Segredos (gitleaks) e dependências (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # O que vai para o servidor e o navegador: falha em alta ou crítica.
      - run: npm audit --omit=dev --audit-level=high
      # Ferramentas de build: falha só em crítica.
      - run: npm audit --audit-level=critical

  zap:
    name: Teste dinâmico (OWASP ZAP, alvo local)
    # Manual e semanal: sobe o app com D1 efêmero e dados fictícios no próprio
    # runner. Não acessa o site publicado nem o banco da Cloudflare.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Subir alvo local
        run: |
          node scripts/zap-target.mjs > zap-target.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q 'Alvo ZAP pronto' zap-target.log && exit 0
            sleep 1
          done
          cat zap-target.log
          exit 1
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8788/gestao
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j'
          allow_issue_writing: false
          # R17: baseline local com CSP real, zero FAIL/WARN; exceções justificadas em rules.tsv.
          fail_action: true
          artifact_name: relatorio-zap
