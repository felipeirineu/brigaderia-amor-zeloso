name: Limpeza dos dados de teste (manual)
# Uso único, autorizado pelo responsável em 14/11/2026: todos os pedidos
# existentes são de teste. Sempre rodar primeiro a PRÉVIA. Não exporta dados,
# não cria artefatos, não muda flags nem publica o app.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: PRÉVIA mostra o que seria apagado; APLICAR apaga.
        type: choice
        default: LIMPEZA_PREVIA
        options:
          - LIMPEZA_PREVIA
          - LIMPEZA_APLICAR
      apagar_clientes:
        description: Apagar também os clientes (e seus dados de cadastro)
        type: boolean
        default: false
      apagar_produtos:
        description: Apagar também produtos, variantes e as fichas ligadas a eles
        type: boolean
        default: false
      backup_baixado:
        description: Baixei o backup no app (Ferramentas → Backup) e guardei fora do GitHub
        type: boolean
        default: false
      confirmacao:
        description: 'Para APLICAR, digite: APAGAR TESTES'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: homologacao-d1
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: homologacao-d1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prévia ou limpeza
        run: node scripts/clean-test-data.mjs
        env:
          CLEANUP_MODE: ${{ inputs.modo }}
          CLEAN_CUSTOMERS: ${{ inputs.apagar_clientes }}
          CLEAN_PRODUCTS: ${{ inputs.apagar_produtos }}
          BACKUP_VERIFIED: ${{ inputs.backup_baixado }}
          CONFIRMATION: ${{ inputs.confirmacao }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
